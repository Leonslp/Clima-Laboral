name: Standalone CLI
on: [push, pull_request]
jobs:
  machineStandalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create SAST config
        run: |
          cat > fluidattacks_sast_config.yaml <<'EOF'
          working_dir: /project
          strictness_threshold: low
          sast:
            include:
              - .
          EOF
      - name: Run Fluid Attacks SAST
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            fluidattacks/sast:latest \
            sast scan /project/fluidattacks_sast_config.yaml


